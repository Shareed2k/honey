version: 2

project_name: honey

before:
  hooks:
    - go mod tidy

builds:
  - id: honey
    main: ./cmd/honey
    binary: honey
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: honey
    repository:
      owner: shareed2k
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/shareed2k/honey"
    description: "Search and operate on instances across GCP, AWS, Kubernetes, Consul, and Proxmox"
    license: "MIT"
    test: |
      system "#{bin}/honey version"

mcp:
  name: "io.github.shareed2k/honey"
  title: "Honey MCP Server"
  description: "Search and operate on instances across GCP, AWS, Kubernetes, Consul, and Proxmox directly from Cursor"
  homepage: "https://github.com/shareed2k/honey"
  auth:
    type: github
    token: "{{ .Env.GITHUB_TOKEN }}"
