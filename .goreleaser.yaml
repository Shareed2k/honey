version: 2

project_name: honey

before:
  hooks:
    - go mod tidy
    - make webui
    - go generate ./...
    - mkdir -p completions
    - go run ./cmd/honey completion bash > completions/honey.bash
    - go run ./cmd/honey completion zsh > completions/honey.zsh
    - go run ./cmd/honey completion fish > completions/honey.fish

builds:
  - id: honey
    main: ./cmd/honey
    binary: honey
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - completions/*
      - runtime/onnx/**

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

homebrew_casks:
  - name: honey
    no_quarantine: true
    repository:
      owner: shareed2k
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/shareed2k/honey"
    description: "Search and operate on instances across GCP, AWS, Kubernetes, Consul, and Proxmox"
    completions:
      bash: completions/honey.bash
      zsh: completions/honey.zsh
      fish: completions/honey.fish

mcp:
  name: "io.github.Shareed2k/honey"
  title: "Honey MCP Server"
  description: "Search instances across GCP, AWS, K8s, Consul & Proxmox"
  homepage: "https://github.com/shareed2k/honey"
  auth:
    type: github
    token: "{{ .Env.GITHUB_TOKEN }}"
