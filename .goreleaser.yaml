version: 2

project_name: honey

before:
  hooks:
    - go mod tidy
    - sh -c 'test -f internal/webserver/static/index.html || go tool task webui'
    - go generate ./...
    - go tool task download-onnx-runtime
    - go tool task build-honey-plugin-init
    - mkdir -p completions
    - go run ./cmd/honey completion bash > completions/honey.bash
    - go run ./cmd/honey completion zsh > completions/honey.zsh
    - go run ./cmd/honey completion fish > completions/honey.fish

builds:
  - id: honey
    main: ./cmd/honey
    binary: honey
    env:
      - CGO_ENABLED=1
      - MACOSX_DEPLOYMENT_TARGET=10.14
      - >-
        CXX={{- if eq .Os "darwin" -}}
          {{- if eq .Arch "amd64" }}o64-clang++{{- else }}oa64-clang++{{- end -}}
        {{- else if eq .Os "windows" -}}
          {{- if eq .Arch "amd64" }}x86_64-w64-mingw32-g++{{- else }}aarch64-w64-mingw32-g++{{- end -}}
        {{- else if eq .Os "linux" -}}
          {{- if eq .Arch "arm64" }}aarch64-linux-gnu-g++{{- else }}g++{{- end -}}
        {{- end }}
      - >-
        CC={{- if eq .Os "darwin" -}}
          {{- if eq .Arch "amd64" }}o64-clang{{- else }}oa64-clang{{- end -}}
        {{- else if eq .Os "windows" -}}
          {{- if eq .Arch "amd64" }}x86_64-w64-mingw32-gcc{{- else }}aarch64-w64-mingw32-gcc{{- end -}}
        {{- else if eq .Os "linux" -}}
          {{- if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{- else }}gcc{{- end -}}
        {{- end }}
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - completions/*
      - runtime/onnx/**
      - build/honey-plugin-init-linux-amd64
      - build/honey-plugin-init-linux-arm64

nfpms:
  - id: honey-deb
    package_name: honey
    ids: [honey] # only the honey build (linux amd64/arm64); non-linux ignored
    formats:
      - deb
    maintainer: "Roman Kredentser <shareed2k@gmail.com>"
    description: "Search and operate on instances across GCP, AWS, Kubernetes, Consul, and Proxmox"
    homepage: "https://github.com/shareed2k/honey"
    license: MIT
    bindir: /usr/bin # honey → /usr/bin/honey
    # Hard deps: only what core (search / ssh exec / web / mesh) needs.
    dependencies:
      - ca-certificates
      - openssh-client
    # Feature-specific tools — pulled by apt unless --no-install-recommends.
    # tmux: session recordings/replay; shellcheck: lint shell recipe steps;
    # python3-flake8: lint python recipe steps. (tun2proxy, for egress --tun,
    # is NOT in apt — install it from https://github.com/tun2proxy/tun2proxy
    # releases if you need transparent-proxy mode.)
    recommends:
      - tmux
      - shellcheck
      - python3-flake8
    contents:
      # Arch-matched honey-plugin-init shim, next to the honey binary so docker
      # plugins (local + remote) find it via HONEY_PLUGIN_INIT_DIR=/usr/bin.
      - src: "build/honey-plugin-init-linux-{{ .Arch }}"
        dst: "/usr/bin/honey-plugin-init-linux-{{ .Arch }}"
        file_info:
          mode: 0755
      # ONNX runtime libs for the arch (anomaly feature; unit sets the env).
      - src: "runtime/onnx/linux/{{ .Arch }}/"
        dst: "/usr/lib/honey/onnx/"
      # systemd unit + example config (config not overwritten on upgrade).
      - src: contrib/systemd/honey.service
        dst: /lib/systemd/system/honey.service
      - src: contrib/systemd/config.example.yaml
        dst: /etc/honey/config.yaml
        type: "config|noreplace"
      # shell completions
      - src: completions/honey.bash
        dst: /usr/share/bash-completion/completions/honey
      - src: completions/honey.zsh
        dst: /usr/share/zsh/site-functions/_honey
      - src: completions/honey.fish
        dst: /usr/share/fish/vendor_completions.d/honey.fish
    scripts:
      postinstall: contrib/nfpm/postinstall.sh
      preremove: contrib/nfpm/preremove.sh
    deb:
      lintian_overrides:
        - statically-linked-binary
        - embedded-library

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

dockers_v2:
  - ids: [honey]
    dockerfile: Dockerfile.release
    images:
      - "ghcr.io/shareed2k/honey"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    flags:
      - "--provenance=false"
    extra_files:
      - runtime/onnx/linux
      - contrib/docker/config.yaml
    annotations:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"

homebrew_casks:
  - name: honey
    repository:
      owner: shareed2k
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/shareed2k/honey"
    description: "Search and operate on instances across GCP, AWS, Kubernetes, Consul, and Proxmox"
    dependencies:
      - formula: openssh
      - formula: tmux
      - formula: tun2proxy
      - formula: shellcheck
      - formula: flake8
    completions:
      bash: completions/honey.bash
      zsh: completions/honey.zsh
      fish: completions/honey.fish
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "#{staged_path}/honey"]
          end

mcp:
  name: "io.github.Shareed2k/honey"
  title: "Honey MCP Server"
  description: "Search instances across GCP, AWS, K8s, Consul & Proxmox"
  homepage: "https://github.com/shareed2k/honey"
  auth:
    type: github
    token: "{{ .Env.GITHUB_TOKEN }}"
