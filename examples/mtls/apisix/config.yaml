# APISIX deployment config for the honey mTLS example (standalone / file-driven).
# Routes + SSL objects live in apisix.local.yaml (rendered from apisix.yaml).
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

apisix:
  ssl:
    enable: true
    listen:
      - port: 9443
  # In standalone mode APISIX reads routes/ssls from apisix.local.yaml.

# Restrict to the plugins this example needs.
plugins:
  - serverless-pre-function   # strip CN= from the client-cert subject DN
  - proxy-rewrite             # forward client-cert fields as upstream headers
