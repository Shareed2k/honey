[versions]
agp = "9.2.1"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
compose-bom = "2024.06.00"
hilt = "2.59.2"
retrofit = "2.11.0"
okhttp = "4.12.0"
