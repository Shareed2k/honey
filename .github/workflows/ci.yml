name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build web UI (embed static)
        run: go tool task webui

      - name: Build WASM plugins
        run: go tool task build-plugin-modules

      - name: Go unit tests with coverage
        run: go test -coverprofile=coverage-unit.txt -covermode=atomic ./... -count=1

      - name: Go integration tests with coverage
        run: go test -tags integration -coverprofile=coverage-int.txt -covermode=atomic -timeout 10m -v ./tests/integration/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-unit.txt,./coverage-int.txt
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run lint + security checks
        run: go tool task lint

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.26.2-3
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,   goarch: amd64, cc: gcc,                     ext: ""}
          - {goos: linux,   goarch: arm64, cc: aarch64-linux-gnu-gcc,   ext: ""}
          - {goos: darwin,  goarch: amd64, cc: o64-clang,               ext: ""}
          - {goos: darwin,  goarch: arm64, cc: oa64-clang,              ext: ""}
          - {goos: windows, goarch: amd64, cc: x86_64-w64-mingw32-gcc, cxx: x86_64-w64-mingw32-g++, ext: ".exe"}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build web UI (embed static)
        run: go tool task webui

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          VERSION="0.0.0-ci+${GITHUB_SHA:0:12}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT="honey-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}" \
            -o "${OUT}" \
            ./cmd/honey
          sha256sum "${OUT}" > "${OUT}.sha256"
          cat "${OUT}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: honey-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            honey-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
