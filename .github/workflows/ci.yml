name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build web UI (embed static)
        run: make webui

      - name: Go test
        run: go test ./... -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build web UI (embed static)
        run: make webui

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build web UI (embed static)
        run: make webui

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt text -severity medium -quiet ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.26.2-3
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,   goarch: amd64, cc: gcc,                     ext: ""}
          - {goos: linux,   goarch: arm64, cc: aarch64-linux-gnu-gcc,   ext: ""}
          - {goos: darwin,  goarch: amd64, cc: o64-clang,               ext: ""}
          - {goos: darwin,  goarch: arm64, cc: oa64-clang,              ext: ""}
          - {goos: windows, goarch: amd64, cc: x86_64-w64-mingw32-gcc,  ext: ".exe"}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build web UI (embed static)
        run: make webui

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          VERSION="0.0.0-ci+${GITHUB_SHA:0:12}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT="honey-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}" \
            -o "${OUT}" \
            ./cmd/honey
          sha256sum "${OUT}" > "${OUT}.sha256"
          cat "${OUT}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: honey-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            honey-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
