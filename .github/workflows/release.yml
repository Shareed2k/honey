name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    if: ${{ !contains(github.ref_name, '-next.') && !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build web UI
        run: task webui

      - name: Run GoReleaser (cross)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.2-3 \
            release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  upload-plugins:
    name: Build and upload WASM plugins
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build WASM plugins
        run: task build-plugin-modules

      - name: Package plugin archives
        run: task package-plugins

      - name: Upload plugin archives to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/plugins/honey-plugin-*.tar.gz
