name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run GoReleaser
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e GITHUB_TOKEN="${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}" \
            -e GOTOOLCHAIN=go1.26.3 \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.2-3 \
            release --clean
