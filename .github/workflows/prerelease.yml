name: PR Prerelease

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prerelease-check:
    name: Validate prerelease build
    if: github.event.action != 'closed' && github.event.action != 'opened'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build web UI
        run: task webui

      - name: Run GoReleaser prerelease snapshot (cross)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.2-3 \
            release --clean --snapshot --skip=publish --config .goreleaser.prerelease.yaml

      - name: Upload prerelease build artifacts
        if: github.event.action == 'opened'
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-build-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            dist/**
          if-no-files-found: error
          retention-days: 7

  prerelease-publish:
    name: Create prerelease tag and publish artifacts
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Select prerelease channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          CHANNEL="next"
          if [[ "${LABELS}" == *"release-rc"* ]]; then
            CHANNEL="rc"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Create and push date-based tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y%m%d)"
          CHANNEL='${{ steps.channel.outputs.channel }}'
          TAG="v0.0.0-${CHANNEL}.${DATE}.${GITHUB_RUN_NUMBER}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG="${TAG}-${GITHUB_RUN_ATTEMPT}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build web UI
        run: task webui

      - name: Run GoReleaser prerelease (cross)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.2-3 \
            release --clean --config .goreleaser.prerelease.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
