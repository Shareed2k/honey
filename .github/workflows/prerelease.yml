name: PR Prerelease

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prerelease-publish:
    name: Create prerelease tag and publish artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select prerelease channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          CHANNEL="next"
          if [[ "${LABELS}" == *"release-rc"* ]]; then
            CHANNEL="rc"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Create and push date-based tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y%m%d)"
          CHANNEL='${{ steps.channel.outputs.channel }}'
          TAG="v0.0.0-${CHANNEL}.${DATE}.${GITHUB_RUN_NUMBER}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG="${TAG}-${GITHUB_RUN_ATTEMPT}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${{ github.event.pull_request.head.sha }}"
          git push origin "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build web UI
        run: task webui

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run GoReleaser prerelease (cross)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e GITHUB_TOKEN \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.2-3 \
            release --clean --config .goreleaser.prerelease.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
