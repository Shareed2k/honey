# https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 10m
  allow-parallel-runners: true

linters:
  default: none
  exclusions:
    paths:
      - webui/node_modules
  settings:
    gosec:
      severity: medium
      confidence: medium
  enable: # please keep this alphabetized
  - gocritic
  - gocyclo
  - govet
  - ineffassign
  - misspell
  - prealloc
  - promlinter
  - revive
  - staticcheck
  - unconvert
  - unparam
  - unused

issues:
  max-same-issues: 50

formatters:
  enable: # please keep this alphabetized
  - gofmt
  - gofumpt
  - goimports
